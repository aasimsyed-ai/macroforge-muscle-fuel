# Photo food estimator — called from the browser by both signed-in and guest
# users, so it must not require a Supabase JWT.
[functions.analyze-food]
verify_jwt = false

# Push delivery — only ever sends to the calling (authenticated) user's own
# subscriptions, so this keeps the default JWT verification on.
[functions.send-push]
verify_jwt = true

# Halku (personal AI trainer) — available to guests too (general fitness/
# nutrition questions), and any personal data it grounds an answer in is sent
# in the request body by the already-authenticated client, not looked up
# server-side, so it doesn't need a Supabase JWT either.
[functions.halku-chat]
verify_jwt = false
